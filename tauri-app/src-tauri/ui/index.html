.toast { position:fixed; top:16px; right:16px; padding:10px 22px; border-radius:8px; color:#fff; font-size:13px; z-index:9999; opacity:0; transition:opacity 0.3s; }

.svc-badge { display:inline-flex; align-items:center; gap:4px; }
.svc-badge .dot { width:7px; height:7px; border-radius:50%; }

.collapse-header .arrow { transition:transform 0.2s; font-size:12px; color:#a0a4b0; }

.collapse-body { overflow:hidden; transition:max-height 0.3s; }
.collapse-body.collapsed { display:none; }
.quick-link { display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid #e1e4e8; border-radius:8px; cursor:pointer; transition:0.2s; text-decoration:none; color:#2d3436; font-size:13px; }
.quick-link:hover { border-color:#0984e3; background:#f8fbff; }
.quick-link .icon { font-size:18px; }
.quick-link .url { margin-left:auto; font-size:11px; color:#a0a4b0; font-family:monospace; }
.form-label { font-size:13px; color:#636e72; font-weight:600; }
.modal input[type=text], .modal input[type=number], .modal select { padding:8px 12px; border:1px solid #dfe6e9; border-radius:6px; font-size:14px; }

<body>

<div class="sidebar">
  <div class="logo">LLooM Suite<span>v2.1 — 自包含智能路由</span></div>
  <a href="#" class="nav-link active" data-page="overview">📊 总览</a>
  <a href="#" class="nav-link" data-page="usage">📈 用量</a>
  <a href="#" class="nav-link" data-page="chat">💬 对话</a>
  <a href="#" class="nav-link" data-page="models">🤖 模型</a>
  <a href="#" class="nav-link" data-page="settings">⚙️ 设置</a>
  <div style="margin-top:auto;padding:10px 20px;">
    <div id="tray-status" class="muted">检查中...</div>
  </div>
</div>

<div class="main" id="content"></div>
<div class="toast" id="toast"></div>
<div id="modal-container"></div>

<script>
// ── API 基础地址 ──
// GUI 的 WebView 页面源是 tauri://localhost，所以 REST 必须用绝对地址
// 指向 Rust axum 服务器。headless/浏览器模式同源，绝对地址同样有效。
const API_BASE = 'http://localhost:7861';

// ── invoke wrapper ──
// 统一走 REST（单一契约）。GUI 和 WebUI 无差异。
function invoke(cmd, args) {
  return restCall(cmd, args || {});
}

// ── REST mapping ──
// Each Tauri-style command maps to one or more REST calls on the Rust server.
async function restCall(cmd, args) {
  const jget = (path) => fetch(API_BASE + path).then(r => r.json());
  const jpost = (path, body) => fetch(API_BASE + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
  }).then(r => r.json());
  const jdelete = (path) => fetch(API_BASE + path, { method: 'DELETE' }).then(r => r.json());

  // Map display names → REST service ids.
  const svcName = (n) => {
    const s = String(n || '').toLowerCase();
    if (s.includes('ollama')) return 'ollama';
    if (s.includes('ai')) return 'ai';
    return 'api';
  };

  switch (cmd) {
    case 'get_services_status': return jget('/api/services/status');
    case 'check_api': return (await jget('/api/health')).status === 'ok';
    case 'check_ai': return (await jget('/api/services/status')).services.find(s => s.name === 'AI Service')?.healthy || false;
    case 'check_ollama': return (await jget('/api/services/status')).services.find(s => s.name === 'Ollama')?.healthy || false;
    case 'get_usage_stats': return jget('/api/stats');
    case 'get_trends': return jget('/api/usage');
    case 'get_quota': return jget('/api/budgets');
    case 'check_budget': return jget(`/api/budgets/check?scope=${encodeURIComponent(args.scope)}&scope_id=${encodeURIComponent(args.scopeId)}`);
    case 'get_models': return jget('/api/models');
    case 'load_conversation': return jget('/api/conversations/' + encodeURIComponent(args.id));
    case 'save_conversation': return jpost('/api/conversations', JSON.parse(args.conversationJson || '{}'));
    case 'get_service_logs': return jget('/api/services/' + encodeURIComponent(svcName(args.serviceName)) + '/logs');
    case 'update_budget': return jpost('/api/budgets', { scope: args.scope, scope_id: args.scopeId, max_budget: args.maxBudget, duration: args.duration });
    case 'add_model': return jpost('/api/models', JSON.parse(args.config || '{}'));
    case 'remove_model': return jdelete('/api/models/' + encodeURIComponent(args.modelName));
    case 'read_env': return jget('/api/config');
    case 'write_env': return jpost('/api/config', { updates: { [args.key]: args.value } });
    case 'write_env_batch': return jpost('/api/config', { updates: args.updates || {} });
    case 'smart_restart': return jpost('/api/services/smart-restart', { changed_keys: args.changedKeys || [] });
    case 'start_ai': return jpost('/api/services/ai/start');
    case 'stop_ai': return jpost('/api/services/ai/stop');
    case 'start_ollama': return jpost('/api/services/ollama/start');
    case 'stop_ollama': return jpost('/api/services/ollama/stop');
    case 'restart_service': return jpost('/api/services/' + encodeURIComponent(svcName(args.serviceName)) + '/restart');
    case 'list_conversations': return (await jget('/api/conversations')).conversations;
    case 'delete_conversation': return jdelete('/api/conversations/' + encodeURIComponent(args.id));
    case 'open_folder': return jpost('/api/system/open-folder', { path: args.path });
    case 'open_web_interface': return jpost('/api/system/open-web', { url: args.url });
    case 'run_cli': return jpost('/api/system/cli', { args: args.args || [] }).then(r => (r.stdout || '') + (r.stderr || ''));
    case 'chat_request':
    case 'orchestrate_request': {
      // SSE → materialize events (same shape as the Tauri command result)
      const body = cmd === 'orchestrate_request'
        ? { query: args.query, history: args.history ? JSON.parse(args.history) : [] }
        : { messages: [{ role: 'user', content: args.query }] };
      const res = await fetch(API_BASE + '/api/' + (cmd === 'orchestrate_request' ? 'orchestrate' : 'chat') + '/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const text = await res.text();
      const events = [];
      let cur = null;
      for (const line of text.split('\n')) {
        if (line.startsWith('event:')) {
          if (cur) { events.push(cur); cur = null; }
          cur = { event: line.slice(7).trim() };
        } else if (line.startsWith('data: ')) {
          const d = line.slice(6);
          try {
            if (cur && cur.data === undefined) { cur.data = JSON.parse(d); }
            else { events.push({ data: JSON.parse(d) }); }
          } catch(e) {}
        }
      }
      if (cur) events.push(cur);
      return events;
    }
    default: throw new Error('unknown command: ' + cmd);
  }
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'info');
  setTimeout(() => { el.className = 'toast ' + (type || 'info'); }, 3000);
}
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Markdown renderer (full: tables, code blocks, lists, quotes) ──
function renderMarkdown(text) {
  if (!text) return '';
  // 用占位符替换 <br> 标签，避免在表格行内被转换为换行符导致表格行断裂
  const BR = '\x00';
  let t = text.replace(/<br\s*\/?>/gi, BR);
  t = escapeHtml(t);

  const lines = t.split('\n');
  let result = [];
  let inCodeBlock = false;
  let codeBlockLines = [];
  let inTable = false;
  let tableHeaders = [];
  let tableRows = [];

  const restoreBR = s => s.replace(/\x00/g, '<br>');
  const brToNL = s => s.replace(/\x00/g, '\n');

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (line.trim().startsWith('```')) {
      if (!inCodeBlock) {
        inCodeBlock = true;
        codeBlockLines = [];
      } else {
        inCodeBlock = false;
        result.push('<pre><code>' + codeBlockLines.join('\n') + '</code></pre>');
      }
      continue;
    }
    if (inCodeBlock) {
      codeBlockLines.push(line);
      continue;
    }

    const trimmed = line.trim();
    if (trimmed.startsWith('|')) {
      const normalized = trimmed.endsWith('|') ? trimmed : trimmed + '|';
      const cells = normalized.split('|').slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c) && c.length > 0)) {
        continue;
      }
      if (!inTable) {
        tableHeaders = cells.map(restoreBR);
        inTable = true;
        if (i + 1 < lines.length) {
          const nextLine = lines[i + 1].trim();
          if (nextLine.startsWith('|')) {
            const nextNorm = nextLine.endsWith('|') ? nextLine : nextLine + '|';
            const nextCells = nextNorm.split('|').slice(1, -1).map(c => c.trim());
            if (nextCells.every(c => /^[-:]+$/.test(c) && c.length > 0)) {
              i++;
              continue;
            }
          }
        }
        inTable = false;
        result.push(brToNL(line));
      } else {
        tableRows.push(cells.map(restoreBR));
      }
      continue;
    } else if (inTable) {
      let tableHtml = '<table><thead><tr>';
      tableHeaders.forEach(h => tableHtml += '<th>' + h + '</th>');
      tableHtml += '</tr></thead><tbody>';
      tableRows.forEach(r => {
        tableHtml += '<tr>';
        for (let j = 0; j < tableHeaders.length; j++) {
          tableHtml += '<td>' + (r[j] || '') + '</td>';
        }
        tableHtml += '</tr>';
      });
      tableHtml += '</tbody></table>';
      result.push(tableHtml);
      inTable = false;
      tableHeaders = [];
      tableRows = [];
      result.push(brToNL(line));
    } else {
      result.push(brToNL(line));
    }
  }

  if (inTable) {
    let tableHtml = '<table><thead><tr>';
    tableHeaders.forEach(h => tableHtml += '<th>' + h + '</th>');
    tableHtml += '</tr></thead><tbody>';
    tableRows.forEach(r => {
      tableHtml += '<tr>';
      for (let j = 0; j < tableHeaders.length; j++) {
        tableHtml += '<td>' + (r[j] || '') + '</td>';
      }
      tableHtml += '</tr>';
    });
    tableHtml += '</tbody></table>';
    result.push(tableHtml);
  }

  let html = result.join('\n');

  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '<hr>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  html = html.replace(/(<\/(?:h2|h3|h4|pre|table|blockquote|ul|ol)>)\n/g, '$1');
  html = html.replace(/(<hr>)\n/g, '$1');
  html = html.replace(/\n(<(?:h2|h3|h4|pre|table|blockquote|ul|ol|li|hr))/g, '$1');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, function(m) {
    return '<ul>' + m.replace(/\n/g, '') + '</ul>';
  });
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<br>(<(?:h2|h3|h4|pre|table|blockquote|ul|ol|hr))/g, '$1');
  html = html.replace(/(<\/(?:h2|h3|h4|pre|table|blockquote|ul|ol)>|<hr>)<br>/g, '$1');
  html = html.replace(/\x00/g, '<br>');

  return html;
}

async function loadRoutingStats() {
  try {
    const data = await invoke('get_usage_stats');
    const rs = data.routing_stats || {};
    let routeTotal = 0, ruleTotal = 0, llmTotal = 0;
    for (const [k, v] of Object.entries(rs)) {
      if (k.startsWith('route:')) routeTotal += v;
      else if (k.startsWith('rule:')) ruleTotal += v;
      else if (k.startsWith('llm:')) llmTotal += v;
    }
    const el = document.getElementById('routing-stats');
    if (el) {
      el.children[0].innerHTML = `<div class="num green">${routeTotal}</div><div class="label">请求路由</div>`;
      el.children[1].innerHTML = `<div class="num ${ruleTotal>0?'green':'green'}">${ruleTotal}</div><div class="label">正则分类 (零成本)</div>`;
      el.children[2].innerHTML = `<div class="num orange">${llmTotal}</div><div class="label">LLM 分类</div>`;
      el.children[3].innerHTML = `<div class="num ${data.cache_enabled?'green':'orange'}">${data.cache_enabled?'✓':'✗'}</div><div class="label">语义缓存</div>`;
    }
    const domainEl = document.getElementById('routing-domain-list');
    if (domainEl) {
      const models = Object.entries(rs).filter(([k]) => k.startsWith('route:')).sort((a,b) => b[1]-a[1]);
      if (models.length > 0) {
        domainEl.innerHTML = '<div style="font-size:13px;color:#636e72;margin-bottom:6px;">模型路由分布:</div>' +
          models.map(([k, c]) => `<span class="badge badge-blue" style="margin:2px;">${escapeHtml(k.slice(6))}: ${c}</span>`).join('');
      }
    }
  } catch(e) {
    // Stats not available yet
  }
}

function drawBarChart(containerId, data, prefix, color) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const entries = Object.entries(data);
  if (entries.length === 0) { el.innerHTML = '<span class="muted">暂无数据</span>'; return; }
  const maxVal = Math.max(...entries.map(([,v]) => v), 0.000001);
  const barW = 40, gap = 12, chartH = 120, labelW = 80;
  const totalW = entries.length * (barW + gap) + labelW + 20;
  let bars = '';
  entries.forEach(([label, val], i) => {
    const h = Math.max((val / maxVal) * chartH, 2);
    const x = labelW + i * (barW + gap) + 10;
    const y = chartH - h + 10;
    const displayVal = prefix === '$' ? '$' + val.toFixed(6) : val;
    const shortLabel = label.length > 12 ? label.substring(0,10) + '..' : label;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="3" opacity="0.85"/>`;
    bars += `<text x="${x + barW/2}" y="${chartH + 25}" text-anchor="middle" font-size="10" fill="#636e72">${escapeHtml(shortLabel)}</text>`;
    bars += `<text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" font-size="9" fill="#636e72">${displayVal}</text>`;
  });
  el.innerHTML = `<svg width="${totalW}" height="${chartH + 35}" style="overflow:visible;">
    <line x1="${labelW + 5}" y1="${chartH + 10}" x2="${totalW - 5}" y2="${chartH + 10}" stroke="#e1e4e8" stroke-width="1"/>
    ${bars}
  </svg>`;
}

        const progress = b.max_budget > 0 ? (spent / b.max_budget * 100) : 0;

        html += `

            <div style="text-align:right;margin-top:6px;">

let conversationList = [];
let chatMessages = [];

async function loadConversationList() {
  try {
    conversationList = await invoke('list_conversations');
    renderConversationList();
    if (!currentConvId && conversationList.length > 0) {
      await selectConversation(conversationList[0].id);
    } else if (currentConvId) {
      await selectConversation(currentConvId);
    } else {
      renderChatMessages();
    }
  } catch(e) {
    const list = document.getElementById('conv-list');
    if (list) list.innerHTML = '<div class="conv-empty">加载失败</div>';
  }
}

function renderConversationList() {
  const list = document.getElementById('conv-list');
  if (!list) return;
  if (conversationList.length === 0) {
    list.innerHTML = '<div class="conv-empty">暂无对话记录<br>点击上方新建</div>';
    return;
  }
  list.innerHTML = conversationList.map(c => {
    const active = c.id === currentConvId ? ' active' : '';
    const time = formatConvTime(c.updated_at);
    return `<div class="conv-item${active}" onclick="selectConversation('${escapeAttr(c.id)}')">
      <div class="conv-title">${escapeHtml(c.title || '新对话')}</div>
      <div class="conv-time">${time ? time + ' · ' : ''}${c.message_count}条</div>
      <span class="conv-del" onclick="event.stopPropagation();deleteConv('${escapeAttr(c.id)}')">×</span>
    </div>`;
  }).join('');
}

function formatConvTime(ts) {
  if (!ts) return '';
  const d = typeof ts === 'string' ? new Date(ts) : new Date(ts * 1000);
  if (isNaN(d.getTime())) return '';
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

async function selectConversation(id) {
  currentConvId = id;
  try {
    const conv = await invoke('load_conversation', { id });
    chatMessages = conv.messages || [];
    renderConversationList();
    renderChatMessages();
  } catch(e) {
    toast('加载对话失败: ' + e, 'error');

function newConversation() {
  currentConvId = null;
  chatMessages = [];
  renderConversationList();
  renderChatMessages();

  if (input) input.focus();
}

async function deleteConv(id) {
  try {
    await invoke('delete_conversation', { id });

function renderChatMessages() {
  const msgs = document.getElementById('messages');
  if (!msgs) return;
  if (chatMessages.length === 0) {
    msgs.innerHTML = '<div class="msg msg-ai"><div class="msg-bubble">你好！我是智能编排助手。点击左侧新建对话或选择历史记录开始聊天。</div></div>';
    return;
  }
  msgs.innerHTML = chatMessages.map(m => renderChatMessage(m)).join('');
  msgs.scrollTop = msgs.scrollHeight;
}

function renderChatMessage(m) {
  switch(m.type) {
    case 'user':
      return `<div class="msg msg-user"><div class="msg-bubble">${escapeHtml(m.content)}</div></div>`;
    case 'ai':
      return `<div class="msg msg-ai"><div class="msg-bubble">${renderMarkdown(m.content)}${m.model_info ? '<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(0,0,0,0.06);font-size:11px;color:#636e72;">' + escapeHtml(m.model_info) + '</div>' : ''}</div></div>`;
    case 'decomp':
      return `<div class="msg-decomp"><b>任务分解</b> (${m.sub_tasks.length} 个子任务)<br>${m.sub_tasks.map(t => '<div class="task-line">→ 子任务' + t.id + ': ' + escapeHtml(t.description) + ' <span class="badge badge-blue">' + escapeHtml(t.selected_model || t.task_type || '') + '</span></div>').join('')}<div class="muted">预估成本: $${m.total_cost.toFixed(6)}</div></div>`;
    case 'summary':
      return `<div class="msg-decomp"><b>汇总</b> 成本: $${m.cost.toFixed(6)} | Token: ${m.tokens} | 耗时: ${m.duration.toFixed(1)}s</div>`;
    default:
      if (m.role === 'user') return `<div class="msg msg-user"><div class="msg-bubble">${escapeHtml(m.content)}</div></div>`;
      if (m.role === 'assistant') return `<div class="msg msg-ai"><div class="msg-bubble">${renderMarkdown(m.content)}${m.model_info ? '<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(0,0,0,0.06);font-size:11px;color:#636e72;">' + escapeHtml(m.model_info) + '</div>' : ''}</div></div>`;
      return '';
  }
}

async function saveCurrentConv() {
  if (chatMessages.length === 0) return;

  let title = '新对话';
  for (const m of chatMessages) {
    const isUser = m.type === 'user' || m.role === 'user';
    if (isUser && m.content) {
      title = m.content.substring(0, 20);
      if (m.content.length > 20) title += '...';
      break;
    }
  }

  const now = new Date().toISOString();
  const conv = {
    id: currentConvId || ('conv_' + Date.now().toString(36)),
    title: title,
    created_at: now,
    updated_at: now,
    messages: chatMessages,
  };

  try {
    const data = await invoke('save_conversation', { conversationJson: JSON.stringify(conv) });
    if (data.id && !currentConvId) currentConvId = data.id;
    conversationList = await invoke('list_conversations');
    renderConversationList();
  } catch(e) {
    // Silent fail — don't interrupt chat for save errors
  }
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  chatMessages.push({ type: 'user', content: msg });
  renderChatMessages();

  const status = document.getElementById('status');
  status.innerHTML = '<span class="spinner"></span> 正在处理...';

  // 构建对话历史（最近10条 user/ai 消息）
  const history = [];
  for (const m of chatMessages) {
    if (m.type === 'user' || m.role === 'user') {
      history.push({ role: 'user', content: m.content });
    } else if ((m.type === 'ai' || m.role === 'assistant') && m.content) {
      history.push({ role: 'assistant', content: m.content });
    }
    if (history.length >= 20) break;
  }
  history.pop();

  try {
    const events = await invoke('orchestrate_request', { query: msg, history: history.length > 0 ? JSON.stringify(history) : null });

    let decomp = null;
    let result = null;
    let modelsUsed = [];
    let errorMsg = null;

    for (const ev of events) {
      const d = ev.data || ev;
      if (ev.event === 'decompose' && d.sub_tasks) decomp = d;
      else if (ev.event === 'task_start' && d.model) modelsUsed.push(d.model);
      else if (ev.event === 'task_done' && d.model) { /* model tracked at start */ }
      else if (ev.event === 'result' && d.response !== undefined) result = d;
      else if (d.error) errorMsg = d.block_reason || d.detail || '未知错误';
    }

    if (errorMsg) {
      status.innerHTML = '';
      chatMessages.push({ type: 'ai', content: '请求被拦截: ' + errorMsg, model_info: '' });
      renderChatMessages();
      await saveCurrentConv();
      return;
    }

    if (decomp && decomp.sub_tasks && decomp.sub_tasks.length > 1) {
      chatMessages.push({ type: 'decomp', sub_tasks: decomp.sub_tasks, total_cost: decomp.total_cost || 0 });
      renderChatMessages();
    }

    if (result) {
      const uniq = [...new Set(modelsUsed)];
      const modelInfo = uniq.length > 0 ? '调用模型: ' + uniq.join(' | ') + (result.sr_info ? ' · ' + result.sr_info : '') : '';
      chatMessages.push({ type: 'ai', content: result.response || '', model_info: modelInfo });
      chatMessages.push({
        type: 'summary',
        cost: result.total_cost || 0,
        tokens: result.total_tokens || 0,
        duration: result.total_duration || 0,
      });
      renderChatMessages();
    }

    status.innerHTML = '';
    await saveCurrentConv();
  } catch(e) {
    status.innerHTML = '<span style="color:#d63031;">请求失败: ' + escapeHtml(String(e)) + '</span>';
    chatMessages.push({
      type: 'ai',
      content: '抱歉，请求处理失败。请检查 API 服务是否正常运行（总览页可启动服务），或稍后重试。',
      model_info: '',
    });
    renderChatMessages();
    await saveCurrentConv();
  }
}

        <button class="btn btn-primary btn-sm" onclick="runCliStatus()">CLI 状态检查</button>
      </div>
      <p class="muted" style="margin-top:8px;">API Key 配置请前往"设置"页面</p>
    `;
  } catch(e) {
    el.innerHTML = '<span class="muted">检查失败: ' + escapeHtml(String(e)) + '</span>';
  }
}

// =============================================
// Page 5: Settings (config focused)
// =============================================
const ENV_SCHEMA = [
  { title: '阿里云百炼（DashScope）', icon: '*', collapsed: false, items: [
    { key: 'DASHSCOPE_API_KEY', label: 'API Key', type: 'password', desc: '主要 LLM 供应商' },
    { key: 'DASHSCOPE_API_BASE', label: 'API Base', type: 'text', desc: '默认 dashscope.aliyuncs.com' },
  ]},
  { title: 'OpenAI', icon: 'O', collapsed: true, items: [
    { key: 'OPENAI_API_KEY', label: 'API Key', type: 'password', desc: 'sk-...' },
    { key: 'OPENAI_BASE_URL', label: 'Base URL', type: 'text', desc: '可选代理地址' },
  ]},
  { title: 'Anthropic', icon: 'A', collapsed: true, items: [
    { key: 'ANTHROPIC_API_KEY', label: 'API Key', type: 'password', desc: 'sk-ant-...' },
  ]},
  { title: '核心配置', icon: '#', collapsed: false, items: [
    { key: 'OLLAMA_API_BASE', label: 'Ollama Base', type: 'text', desc: '本地 Ollama 地址' },
    { key: 'LLOOM_API_PORT', label: 'API 端口', type: 'text', desc: '默认 7860' },
    { key: 'LLOOM_DATA_DIR', label: '数据目录', type: 'text', desc: 'SQLite/缓存/对话' },
  ]},
];
let envValues = {};

async function renderSettings(el) {
  el.innerHTML = `
    <h2 style="margin-bottom:14px;">设置</h2>
    <div class="grid grid-2" style="margin-bottom:14px;">
      <div class="card">
        <h2>环境检查</h2>
        <div id="env-check"><span class="spinner"></span> 检查中...</div>
      </div>
      <div class="card">
        <h2>快捷操作</h2>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          <button class="btn btn-primary btn-sm" onclick="saveAllEnv()">保存全部</button>
          <button class="btn btn-warning btn-sm" onclick="smartApplyConfig()">智能应用配置</button>
          <button class="btn btn-sm" onclick="openDataFolder()" style="background:#636e72;color:#fff;">数据目录</button>
          <button class="btn btn-sm" onclick="openWeb('http://localhost:7860/docs')" style="background:#636e72;color:#fff;">API 文档</button>
        </div>
        <p class="muted" style="margin-top:8px;">智能应用配置：保存后自动重启 API 服务使配置生效</p>
      </div>
    </div>
    <div class="card">
      <h2>API 密钥配置</h2>
      <div id="env-form"><span class="muted">加载中...</span></div>
    </div>
    <div class="card">
      <div class="collapse-header" onclick="toggleCollapse('models')">
        <span class="title">🤖 已注册模型</span>
        <span class="arrow collapsed" id="arrow-models">v</span>
      </div>
      <div class="collapse-body collapsed" id="body-models">
        <pre id="models-output" style="background:#1a1d24;color:#00b894;padding:14px;border-radius:8px;font-size:12px;overflow:auto;margin-top:8px;">点击展开加载...</pre>
      </div>
    </div>
    <div class="card">
      <div class="collapse-header" onclick="toggleCollapse('cli-output')">
        <span class="title">🖥️ CLI 诊断输出</span>
        <span class="arrow collapsed" id="arrow-cli-output">v</span>
      </div>
      <div class="collapse-body collapsed" id="body-cli-output">
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-success" onclick="runHealthCheck()">健康检查</button>
          <button class="btn btn-sm btn-primary" onclick="runCliStatus()">查看状态</button>
        </div>
        <pre id="cli-output" style="background:#1a1d24;color:#00b894;padding:14px;border-radius:8px;font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;margin-top:8px;">点击上方按钮执行 CLI 命令...</pre>
      </div>
    </div>
  `;
  await Promise.all([checkEnv(), loadEnvForm()]);
}

async function checkEnv() {
  try {
    const [apiOk, ollamaOk, status] = await Promise.all([
      invoke('check_ai'), invoke('check_ollama'), invoke('get_services_status')
    ]);
    const el = document.getElementById('env-check');
    if (!el) return;
    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f2f6;"><span>AI 服务 (:7862)</span><span class="badge ${apiOk?'badge-green':'badge-red'}">${apiOk?'运行中':'未运行'}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f2f6;"><span>Ollama (:11434)</span><span class="badge ${ollamaOk?'badge-green':'badge-red'}">${ollamaOk?'运行中':'未运行'}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;"><span>服务健康</span><span class="badge ${status.running?'badge-green':'badge-red'}">${status.healthy}/${status.total}</span></div>
    `;
  } catch(e) {}
}

async function loadEnvForm() {
  try {
    envValues = await invoke('read_env');
    renderEnvForm();
  } catch(e) {
    document.getElementById('env-form').innerHTML = '<span class="badge badge-red">读取 .env 失败</span>';
  }
}

function renderEnvForm() {
  const c = document.getElementById('env-form');
  if (!c) return;
  let html = '';
  ENV_SCHEMA.forEach((s, si) => {
    const cls = s.collapsed ? ' collapsed' : '';
    html += `<div class="env-section"><div class="env-section-header" onclick="toggleSection(${si})"><span class="arrow${cls}">v</span> ${s.icon} ${s.title}</div><div class="env-section-body${cls}" id="section-${si}">`;
    s.items.forEach(item => {
      const val = envValues[item.key] || '';
      const isSet = val.trim().length > 0;
      const dv = item.type === 'password' ? '' : val;
      html += `<div class="env-field"><div class="status-dot ${isSet?'set':'empty'}"></div><div class="env-field-label">${item.label}<span class="desc">${item.desc||''}</span></div>`;
      if (item.type === 'password') {
        html += `<input type="password" id="env-${item.key}" placeholder="${isSet?'已配置（输入新值覆盖）':(item.desc||'')}" value=""><span class="toggle-vis" onclick="togglePw('env-${item.key}')">👁</span>`;
      } else {
        html += `<input type="text" id="env-${item.key}" placeholder="${item.desc||''}" value="${escapeAttr(dv)}">`;
      }
      html += `<button class="btn btn-sm btn-primary" onclick="saveEnvKey('${item.key}')">保存</button></div>`;
    });
    html += '</div></div>';
  });
  c.innerHTML = html;
}

function toggleSection(i) {
  const b = document.getElementById('section-' + i);
  const a = document.querySelectorAll('.env-section-header .arrow');
  if (b) b.classList.toggle('collapsed');
  if (a[i]) a[i].classList.toggle('collapsed');
}
function togglePw(id) { const e = document.getElementById(id); if (e) e.type = e.type === 'password' ? 'text' : 'password'; }

function toggleCollapse(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (body) body.classList.toggle('collapsed');
  if (arrow) arrow.classList.toggle('collapsed');
  // Lazy load: if body is now visible, trigger loaders
  if (body && !body.classList.contains('collapsed')) {
    if (id === 'models') loadModelsPre();
    if (id === 'pricing' || id === 'routing-table') loadPricingTable();
    if (id === 'init-wizard') loadInitWizard();
    if (id === 'cli-output') { /* wait for button */ }
  }
}

async function saveEnvKey(key) {
  const el = document.getElementById('env-' + key);
  if (!el) return;
  const val = el.value.trim();
  if (val === '' && el.type === 'password') { toast('请输入新值', 'info'); return; }
  try {
    await invoke('write_env', { key, value: val });
    envValues[key] = val;
    toast(key + ' 已保存', 'success');
    renderEnvForm();
  } catch(e) { toast('保存失败: ' + e, 'error'); }
}

async function saveAllEnv() {
  const updates = {};
  let changed = 0;
  ENV_SCHEMA.forEach(s => s.items.forEach(item => {
    const el = document.getElementById('env-' + item.key);
    if (!el) return;
    const val = el.value.trim();
    if (val === '' && item.type === 'password') return;
    if (val !== (envValues[item.key] || '')) { updates[item.key] = val; changed++; }
  }));
  if (changed === 0) { toast('没有需要保存的更改', 'info'); return; }
  try {
    await invoke('write_env_batch', { updates });
    Object.assign(envValues, updates);
    toast(`已保存 ${changed} 项配置`, 'success');
    renderEnvForm();
  } catch(e) { toast('批量保存失败: ' + e, 'error'); }
}

async function smartApplyConfig() {
  const changedKeys = [];
  ENV_SCHEMA.forEach(s => s.items.forEach(item => {
    const el = document.getElementById('env-' + item.key);
    if (!el) return;
    const val = el.value.trim();
    if (val === '' && item.type === 'password') return;
    if (val !== (envValues[item.key] || '')) {
      changedKeys.push(item.key);
    }
  }));

  if (changedKeys.length === 0) {
    toast('没有变更的配置项', 'info');
    return;
  }

  const updates = {};
  changedKeys.forEach(k => {
    const el = document.getElementById('env-' + k);
    updates[k] = el.value.trim();
  });

  try {
    await invoke('write_env_batch', { updates });
    Object.assign(envValues, updates);
  } catch(e) {
    toast('保存配置失败: ' + e, 'error');
    return;
  }

  toast('正在重启 API 服务使配置生效...', 'info');
  renderEnvForm();
  try {
    const result = await invoke('smart_restart', { changedKeys });
    if (result.ok && result.restarted.length > 0) {
      toast(`配置已生效，已重启 ${result.restarted.join(', ')}`, 'success');
    } else if (result.errors.length > 0) {
      toast('重启失败: ' + result.errors.join('; '), 'error');
    } else {
      toast('配置已保存，无需重启', 'success');
    }
  } catch(e) {
    toast('智能重启失败: ' + e, 'error');
  }
}

async function loadModelsPre() {
  try {
    const data = await invoke('get_models');
    const out = document.getElementById('models-output');
    if (!out) return;
    const models = data.models || [];
    out.textContent = models.length === 0 ? '无模型' : models.map(m =>
      `${m.name}  [${m.provider}]  ${m.litellm_model}  in=$${m.input_cost_per_token}/tok  rpm=${m.rpm}${m.task_type ? '  task=' + m.task_type : ''}`
    ).join('\n');
  } catch(e) {
    const out = document.getElementById('models-output');
    if (out) out.textContent = '错误: ' + e;
  }
}

async function runCliStatus() {
  const out = document.getElementById('cli-output') || document.getElementById('init-wizard-content');
  if (out && out.id === 'cli-output') out.textContent = '执行中...';
  try {
    const result = await invoke('run_cli', { args: ['status'] });
    const target = document.getElementById('cli-output');
    if (target) target.textContent = result || '无输出';
  } catch(e) {
    const target = document.getElementById('cli-output');
    if (target) target.textContent = '错误: ' + e;
  }
}

async function runHealthCheck() {
  toast('正在执行健康检查...', 'info');
  try {
    const [apiOk, ollamaOk, stats] = await Promise.all([
      invoke('check_ai'),
      invoke('check_ollama'),
      invoke('get_usage_stats'),
    ]);
    const report = [
      `AI 服务 (:7862):  ${apiOk ? '✓ 健康' : '✗ 未运行'}`,
      `Ollama (:11434):     ${ollamaOk ? '✓ 健康' : '✗ 未运行'}`,
      `可用模型:            ${stats.model_count || 0}`,
      `语义缓存:            ${stats.cache_enabled ? '✓ 启用' : '✗ 未启用'}`,
      `累计花费:            $${(stats.total_spend || 0).toFixed(6)}`,
    ].join('\n');
    const mc = document.getElementById('modal-container');
    mc.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
      <span class="modal-close" onclick="closeModal()">×</span>
      <h2>健康检查结果</h2>
      <div class="log-viewer">${escapeHtml(report)}</div>
      <div style="margin-top:10px;text-align:right;">
        <button class="btn btn-sm" onclick="closeModal()">关闭</button>
      </div>
    </div></div>`;
  } catch(e) {
    const mc = document.getElementById('modal-container');
    mc.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
      <span class="modal-close" onclick="closeModal()">×</span>
      <h2 style="color:#d63031;">健康检查失败</h2>
      <div class="log-viewer">${escapeHtml(String(e))}</div>
      <div style="margin-top:10px;text-align:right;">
        <button class="btn btn-sm" onclick="closeModal()">关闭</button>
      </div>
    </div></div>`;
  }
}
