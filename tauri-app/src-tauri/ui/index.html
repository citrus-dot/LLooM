<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLooM v2 — Intelligent LLM Routing</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
  --text: #c9d1d9; --text-dim: #8b949e; --accent: #58a6ff; --accent2: #3fb950;
  --danger: #f85149; --warn: #d29922; --sidebar-w: 180px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
.sidebar-header span { font-size: 11px; color: var(--text-dim); }
.nav { flex: 1; padding: 8px 0; }
.nav-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-dim); transition: all 0.15s; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface2); color: var(--accent); border-left: 3px solid var(--accent); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
.topbar h2 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
.stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.stat-card .value { font-size: 24px; font-weight: 700; color: var(--accent); }

/* Table */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 11px; }

/* Badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-ok { background: rgba(63,185,80,0.2); color: var(--accent2); }
.badge-down { background: rgba(248,81,73,0.2); color: var(--danger); }

/* Buttons */
.btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 13px; transition: all 0.15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-danger { border-color: var(--danger); color: var(--danger); }

/* Chat */
.chat-layout { display: flex; height: 100%; gap: 12px; }
.chat-sidebar { width: 200px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; }
.chat-sidebar-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.chat-sidebar-list { flex: 1; overflow-y: auto; }
.chat-sidebar-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; }
.chat-sidebar-item:hover { background: var(--surface2); }
.chat-sidebar-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
.chat-main { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
.msg { margin-bottom: 12px; max-width: 80%; }
.msg-user { margin-left: auto; text-align: right; }
.msg-ai { max-width: 100%; }
.msg-bubble { display: inline-block; padding: 8px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
.msg-user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg-ai .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-input { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-input textarea { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 14px; resize: none; height: 40px; }
.chat-input textarea:focus { outline: none; border-color: var(--accent); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; min-width: 400px; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; animation: slideIn 0.3s; }
.toast-ok { background: rgba(63,185,80,0.9); color: #fff; }
.toast-err { background: rgba(248,81,73,0.9); color: #fff; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

/* Collapsible */
.collapse-header { cursor: pointer; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
.collapse-header:hover { color: var(--accent); }
.collapse-body { overflow: hidden; }
.collapse-body.collapsed { display: none; }
.arrow { transition: transform 0.2s; }
.arrow.rotated { transform: rotate(90deg); }

/* Misc */
.muted { color: var(--text-dim); }
pre { background: var(--surface2); padding: 8px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>LLooM</h1>
    <span>v2.0 — Intelligent Routing</span>
  </div>
  <div class="nav" id="nav">
    <div class="nav-item active" data-page="overview" onclick="renderPage('overview')"><span class="icon">📊</span> 总览</div>
    <div class="nav-item" data-page="usage" onclick="renderPage('usage')"><span class="icon">📈</span> 用量</div>
    <div class="nav-item" data-page="chat" onclick="renderPage('chat')"><span class="icon">💬</span> 对话</div>
    <div class="nav-item" data-page="models" onclick="renderPage('models')"><span class="icon">🤖</span> 模型</div>
    <div class="nav-item" data-page="settings" onclick="renderPage('settings')"><span class="icon">⚙️</span> 设置</div>
  </div>
  <div class="sidebar-footer" id="sidebar-footer">状态检查中...</div>
</div>

<div class="main">
  <div class="topbar">
    <h2 id="page-title">总览</h2>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="modal-container"></div>

<script>
// ── Tauri invoke wrapper ──
function waitForTauri(maxWait) {
  maxWait = maxWait || 5000;
  return new Promise((resolve, reject) => {
    if (window.__TAURI__ && window.__TAURI__.core) return resolve();
    const start = Date.now();
    const timer = setInterval(() => {
      if (window.__TAURI__ && window.__TAURI__.core) {
        clearInterval(timer);
        resolve();
      } else if (Date.now() - start > maxWait) {
        clearInterval(timer);
        reject('Tauri not ready (timeout)');
      }
    }, 50);
  });
}

function invoke(cmd, args) {
  if (window.__TAURI__ && window.__TAURI__.core) {
    return window.__TAURI__.core.invoke(cmd, args || {});
  }
  // Retry: wait for Tauri runtime to inject __TAURI__
  return waitForTauri().then(() => {
    if (window.__TAURI__ && window.__TAURI__.core) {
      return window.__TAURI__.core.invoke(cmd, args || {});
    }
    return Promise.reject('Tauri not ready');
  });
}

// ── Toast ──
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── Modal ──
function showModal(html) {
  document.getElementById('modal-container').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

// ── Collapsible ──
function toggleCollapse(id) {
  const body = document.getElementById(id + '-body');
  const arrow = document.getElementById(id + '-arrow');
  if (body) { body.classList.toggle('collapsed'); }
  if (arrow) { arrow.classList.toggle('rotated'); }
}

// ── Markdown ──
function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    .replace(/```([\s\S]*?)```/g, (m, c) => `<pre>${c.replace(/</g,'&lt;')}</pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/\n/g, '<br>');
  return html;
}

// ── Page routing ──
let currentPage = 'overview';

function renderPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = { overview: '总览', usage: '用量', chat: '对话', models: '模型', settings: '设置' };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = '';

  switch (page) {
    case 'overview': renderOverview(); break;
    case 'usage': renderUsage(); break;
    case 'chat': renderChat(); break;
    case 'models': renderModels(); break;
    case 'settings': renderSettings(); break;
  }
}

// ── Overview page ──
async function renderOverview() {
  document.getElementById('content').innerHTML = `
    <div class="stat-grid" id="overview-stats"><div class="muted">加载中...</div></div>
    <div class="card"><div class="card-title">服务状态</div><div id="overview-services"></div></div>
    <div class="card"><div class="card-title">快捷操作</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="invoke('start_api').then(()=>toast('API 已启动'))">启动 API</button>
        <button class="btn btn-danger" onclick="invoke('stop_api').then(()=>toast('API 已停止'))">停止 API</button>
        <button class="btn" onclick="invoke('start_ollama').then(()=>toast('Ollama 启动中'))">启动 Ollama</button>
        <button class="btn" onclick="openWebUI()">打开 Web UI</button>
      </div>
    </div>`;

  try {
    const status = await invoke('get_services_status');
    const stats = await invoke('get_usage_stats');
    const statsData = JSON.parse(stats || '{}');

    document.getElementById('overview-stats').innerHTML = `
      <div class="stat-card"><div class="label">活跃模型</div><div class="value">${statsData.model_count || 0}</div></div>
      <div class="stat-card"><div class="label">总花费</div><div class="value">$${(statsData.total_spend || 0).toFixed(6)}</div></div>
      <div class="stat-card"><div class="label">服务运行</div><div class="value">${status.running}/${status.total}</div></div>
      <div class="stat-card"><div class="label">语义缓存</div><div class="value" style="font-size:14px;">${statsData.cache_enabled ? '✓ 启用' : '✗ 未启用'}</div></div>`;

    document.getElementById('overview-services').innerHTML = `
      <table><thead><tr><th>服务</th><th>状态</th><th>健康</th></tr></thead><tbody>
        ${status.services.map(s => `<tr><td>${s.name}</td><td>${s.status}</td><td><span class="badge ${s.healthy ? 'badge-ok' : 'badge-down'}">${s.healthy ? '✓' : '✗'}</span></td></tr>`).join('')}
      </tbody></table>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="muted">无法加载数据: ${e}</div></div>`;
  }
}

// ── Usage page ──
async function renderUsage() {
  document.getElementById('content').innerHTML = `<div class="muted">加载中...</div>`;
  try {
    const statsRaw = await invoke('get_usage_stats');
    const stats = JSON.parse(statsRaw || '{}');
    const usageRaw = await invoke('get_trends');
    const usage = JSON.parse(usageRaw || '{}');
    const budgetsRaw = await invoke('get_quota');
    const budgets = JSON.parse(budgetsRaw || '{}');

    let modelRows = (usage.usage || []).map(u => `<tr>
      <td>${u.model_name}</td><td>${u.request_count}</td>
      <td>${u.total_input_tokens || 0}</td><td>${u.total_output_tokens || 0}</td>
      <td>$${(u.total_cost || 0).toFixed(6)}</td></tr>`).join('');

    let budgetRows = (budgets.budgets || []).map(b => `<tr>
      <td>${b.scope}/${b.scope_id}</td><td>$${b.max_budget}</td><td>${b.duration}</td></tr>`).join('');

    let routingHtml = '';
    const rs = stats.routing_stats || {};
    for (const [k, v] of Object.entries(rs)) {
      routingHtml += `<tr><td>${k}</td><td>${v}</td></tr>`;
    }

    document.getElementById('content').innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">模型数</div><div class="value">${stats.model_count || 0}</div></div>
        <div class="stat-card"><div class="label">总花费</div><div class="value">$${(stats.total_spend || 0).toFixed(6)}</div></div>
      </div>
      <div class="card"><div class="card-title">模型用量</div>
        <table><thead><tr><th>模型</th><th>请求数</th><th>输入Token</th><th>输出Token</th><th>花费</th></tr></thead>
        <tbody>${modelRows || '<tr><td colspan="5" class="muted">暂无数据</td></tr>'}</tbody></table></div>
      <div class="card"><div class="card-title">预算</div>
        <table><thead><tr><th>范围</th><th>上限</th><th>周期</th></tr></thead>
        <tbody>${budgetRows || '<tr><td colspan="3" class="muted">暂无预算</td></tr>'}</tbody></table></div>
      <div class="card"><div class="card-title">路由统计</div>
        <table><thead><tr><th>路由</th><th>次数</th></tr></thead>
        <tbody>${routingHtml || '<tr><td colspan="2" class="muted">暂无数据</td></tr>'}</tbody></table></div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="muted">加载失败: ${e}</div></div>`;
  }
}

// ── Chat page ──
let currentConvId = null;
let chatMessages = [];

async function renderChat() {
  document.getElementById('content').innerHTML = `
    <div class="chat-layout" style="height:calc(100vh - 120px);">
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <span style="font-size:13px;font-weight:600;">对话</span>
          <button class="btn" style="padding:2px 8px;font-size:12px;" onclick="newConversation()">+ 新建</button>
        </div>
        <div class="chat-sidebar-list" id="conv-list"></div>
      </div>
      <div class="chat-main">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
          <textarea id="chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
          <button class="btn btn-primary" onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>`;

  await loadConversationList();
}

async function loadConversationList() {
  try {
    const list = await invoke('list_conversations');
    document.getElementById('conv-list').innerHTML = list.map(c =>
      `<div class="chat-sidebar-item ${c.id === currentConvId ? 'active' : ''}" onclick="loadConversation('${c.id}')">
        <div style="font-weight:600;font-size:12px;">${c.title || '新对话'}</div>
        <div style="font-size:11px;color:var(--text-dim);">${c.message_count} 条消息</div>
      </div>`).join('') || '<div class="muted" style="padding:12px;">暂无对话</div>';
  } catch (e) {}
}

function newConversation() {
  currentConvId = null;
  chatMessages = [];
  document.getElementById('chat-messages').innerHTML = '';
  loadConversationList();
}

async function loadConversation(id) {
  try {
    const data = await invoke('load_conversation', { id });
    const conv = JSON.parse(data);
    currentConvId = conv.id || id;
    chatMessages = conv.messages || [];
    renderChatMessages();
    await loadConversationList();
  } catch (e) { toast('加载失败', 'err'); }
}

function renderChatMessages() {
  const html = chatMessages.map(m => {
    if (m.role === 'user') {
      return `<div class="msg msg-user"><div class="msg-bubble">${renderMarkdown(m.content)}</div></div>`;
    } else {
      return `<div class="msg msg-ai"><div class="msg-bubble">${renderMarkdown(m.content)}</div></div>`;
    }
  }).join('');
  const el = document.getElementById('chat-messages');
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  chatMessages.push({ role: 'user', content: text });
  renderChatMessages();

  const loadingEl = document.createElement('div');
  loadingEl.className = 'msg msg-ai';
  loadingEl.innerHTML = '<div class="msg-bubble muted">思考中...</div>';
  document.getElementById('chat-messages').appendChild(loadingEl);

  try {
    const history = JSON.stringify(chatMessages.slice(0, -1));
    const result = await invoke('chat_request', { query: text, history });
    const events = JSON.parse(result || '[]');

    let response = '';
    let routing = null;
    for (const ev of events) {
      if (ev.routing) routing = ev.routing;
      if (ev.chunk) response += ev.chunk;
      if (ev.content) response = ev.content;
      if (ev.error) { response = `[错误: ${ev.detail || ev.block_reason || '未知'}]`; break; }
    }

    loadingEl.remove();
    chatMessages.push({ role: 'assistant', content: response });
    renderChatMessages();
    await saveCurrentConversation();
  } catch (e) {
    loadingEl.remove();
    chatMessages.push({ role: 'assistant', content: `[请求失败: ${e}]` });
    renderChatMessages();
  }
}

async function saveCurrentConversation() {
  if (chatMessages.length === 0) return;
  const conv = {
    id: currentConvId || Date.now().toString(36),
    title: chatMessages.find(m => m.role === 'user')?.content?.slice(0, 20) || '新对话',
    messages: chatMessages,
  };
  const result = await invoke('save_conversation', { conversationJson: JSON.stringify(conv) });
  const data = JSON.parse(result);
  if (data.id) { currentConvId = data.id; }
  await loadConversationList();
}

// ── Models page ──
async function renderModels() {
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="showAddModel()">+ 添加模型</button>`;
  document.getElementById('content').innerHTML = `<div class="card"><div class="muted">加载中...</div></div>`;
  try {
    const raw = await invoke('get_models');
    const data = JSON.parse(raw || '{}');
    const models = data.models || [];
    document.getElementById('content').innerHTML = `
      <div class="card"><div class="card-title">已注册模型 (${models.length})</div>
        <table><thead><tr><th>名称</th><th>供应商</th><th>LiteLLM 模型</th><th>输入 $/1K</th><th>输出 $/1K</th><th>RPM</th><th>操作</th></tr></thead>
        <tbody>${models.map(m => `<tr>
          <td>${m.name}</td><td>${m.provider}</td><td>${m.litellm_model}</td>
          <td>${(m.input_cost_per_token * 1000).toFixed(6)}</td>
          <td>${(m.output_cost_per_token * 1000).toFixed(6)}</td><td>${m.rpm}</td>
          <td><button class="btn btn-danger" style="padding:2px 8px;font-size:12px;" onclick="removeModel('${m.name}')">删除</button></td>
        </tr>`).join('')}</tbody></table></div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="muted">加载失败: ${e}</div></div>`;
  }
}

function showAddModel() {
  showModal(`
    <h3>添加模型</h3>
    <div class="form-group"><label>模型名称</label><input id="m-name" placeholder="如 qwen-plus"></div>
    <div class="form-group"><label>供应商</label><select id="m-provider" onchange="fillProviderPreset()">
      <option value="dashscope">阿里云 DashScope</option>
      <option value="openai">OpenAI</option>
      <option value="ollama">Ollama (本地)</option>
      <option value="custom">自定义</option>
    </select></div>
    <div class="form-group"><label>LiteLLM 模型</label><input id="m-litellm" placeholder="如 openai/qwen-plus"></div>
    <div class="form-group"><label>API Base (URL 或环境变量名)</label><input id="m-api-base" placeholder="如 DASHSCOPE_API_BASE"></div>
    <div class="form-group"><label>API Key 环境变量名</label><input id="m-api-key-env" placeholder="如 DASHSCOPE_API_KEY"></div>
    <div class="form-group"><label>任务类型</label><select id="m-task-type">
      <option value="general">通用</option><option value="coding">编程</option>
      <option value="math_logic">数学逻辑</option><option value="complex_reasoning">复杂推理</option>
      <option value="classification">分类</option></select></div>
    <div class="form-group"><label>输入成本 ($/token)</label><input id="m-in-cost" type="number" step="0.000001" value="0"></div>
    <div class="form-group"><label>输出成本 ($/token)</label><input id="m-out-cost" type="number" step="0.000001" value="0"></div>
    <div class="form-group"><label>RPM</label><input id="m-rpm" type="number" value="60"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doAddModel()">添加</button>
    </div>`);
  fillProviderPreset();
}

function fillProviderPreset() {
  const p = document.getElementById('m-provider').value;
  const presets = {
    dashscope: { litellm: 'openai/', api_base: 'DASHSCOPE_API_BASE', api_key_env: 'DASHSCOPE_API_KEY' },
    openai: { litellm: '', api_base: '', api_key_env: 'OPENAI_API_KEY' },
    ollama: { litellm: 'ollama/', api_base: 'OLLAMA_API_BASE', api_key_env: '' },
    custom: { litellm: '', api_base: '', api_key_env: '' },
  };
  const preset = presets[p] || presets.custom;
  if (!document.getElementById('m-litellm').value || document.getElementById('m-litellm').value.endsWith('/')) {
    document.getElementById('m-litellm').value = preset.litellm;
  }
  document.getElementById('m-api-base').value = preset.api_base;
  document.getElementById('m-api-key-env').value = preset.api_key_env;
}

async function doAddModel() {
  const config = {
    name: document.getElementById('m-name').value,
    provider: document.getElementById('m-provider').value,
    litellm_model: document.getElementById('m-litellm').value,
    api_base: document.getElementById('m-api-base').value,
    api_key_env: document.getElementById('m-api-key-env').value,
    task_type: document.getElementById('m-task-type').value,
    input_cost_per_token: parseFloat(document.getElementById('m-in-cost').value) || 0,
    output_cost_per_token: parseFloat(document.getElementById('m-out-cost').value) || 0,
    rpm: parseInt(document.getElementById('m-rpm').value) || 60,
  };
  if (!config.name || !config.litellm_model) { toast('请填写名称和模型', 'err'); return; }
  try {
    await invoke('add_model', { config: JSON.stringify(config) });
    closeModal();
    toast('模型已添加');
    renderModels();
  } catch (e) { toast(`添加失败: ${e}`, 'err'); }
}

async function removeModel(name) {
  if (!confirm(`确认删除模型 ${name}?`)) return;
  try {
    await invoke('remove_model', { modelName: name });
    toast('模型已删除');
    renderModels();
  } catch (e) { toast(`删除失败: ${e}`, 'err'); }
}

// ── Settings page ──
const ENV_SCHEMA = [
  { section: '阿里云 DashScope', keys: [
    { key: 'DASHSCOPE_API_KEY', label: 'API Key', type: 'password' },
    { key: 'DASHSCOPE_API_BASE', label: 'API Base', type: 'text' },
  ]},
  { section: 'OpenAI', keys: [
    { key: 'OPENAI_API_KEY', label: 'API Key', type: 'password' },
    { key: 'OPENAI_BASE_URL', label: 'Base URL', type: 'text' },
  ]},
  { section: 'Ollama', keys: [
    { key: 'OLLAMA_API_BASE', label: 'API Base', type: 'text' },
  ]},
  { section: '核心配置', keys: [
    { key: 'LLOOM_API_PORT', label: 'API 端口', type: 'text' },
    { key: 'LLOOM_DATA_DIR', label: '数据目录', type: 'text' },
  ]},
];

async function renderSettings() {
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="saveEnv()">保存配置</button>`;
  document.getElementById('content').innerHTML = `<div class="muted">加载中...</div>`;
  try {
    const env = await invoke('read_env');
    let html = '';
    for (const sec of ENV_SCHEMA) {
      html += `<div class="card"><div class="card-title">${sec.section}</div>`;
      for (const k of sec.keys) {
        const val = env[k.key] || '';
        html += `<div class="form-group"><label>${k.label} (${k.key})</label>
          <input id="env-${k.key}" type="${k.type}" value="${val}" placeholder="${k.type === 'password' ? '未设置' : ''}"></div>`;
      }
      html += '</div>';
    }
    document.getElementById('content').innerHTML = html;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="muted">加载失败: ${e}</div></div>`;
  }
}

async function saveEnv() {
  const updates = {};
  for (const sec of ENV_SCHEMA) {
    for (const k of sec.keys) {
      const el = document.getElementById(`env-${k.key}`);
      if (el) updates[k.key] = el.value;
    }
  }
  try {
    await invoke('write_env_batch', { updates });
    const changedKeys = Object.keys(updates);
    const result = await invoke('smart_restart', { changedKeys });
    if (result.ok) {
      toast(`已保存并重启服务: ${result.restarted.join(', ')}`);
    } else {
      toast(`保存成功但重启出错: ${result.errors.join('; ')}`, 'err');
    }
  } catch (e) { toast(`保存失败: ${e}`, 'err'); }
}

// ── Misc ──
function openWebUI() { invoke('open_web_interface', { url: 'http://localhost:7860/api/health' }); }

// ── Sidebar footer status ──
async function updateSidebarStatus() {
  try {
    const apiOk = await invoke('check_api');
    const ollamaOk = await invoke('check_ollama');
    const apiStr = apiOk ? '✓' : '✗';
    const ollamaStr = ollamaOk ? '✓' : '✗';
    document.getElementById('sidebar-footer').innerHTML = `API ${apiStr} | Ollama ${ollamaStr}`;
  } catch {
    document.getElementById('sidebar-footer').textContent = '状态未知';
  }
}

// ── Init ──
waitForTauri().then(() => {
  renderPage('overview');
  updateSidebarStatus();
  setInterval(updateSidebarStatus, 30000);
}).catch(err => {
  document.getElementById('content').innerHTML = `<div class="card"><div class="muted">等待 Tauri 运行时超时: ${err}<br>请重新打开应用</div></div>`;
});
</script>
