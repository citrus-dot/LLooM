[package]
name = "litellm-suite"
version = "1.0.0"
description = "LiteLLM 智能路由代理桌面管理应用"
authors = ["LiteLLM Suite"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
