# ====================================
# 数据面 Worker Instance 配置
# 职责：处理 LLM 请求 / 路由 / 缓存 / 负载均衡
# 端口：4001（主机）→ 4000（容器）
# ====================================

# ---- 模型列表 ----
# 同名 model_name 的多个条目 = 同一模型组的多个部署
# Router 在同一组内做负载均衡 / 故障切换
#
# 定价来源：阿里云百炼官方定价页（中国内地，2026-05 更新）
# https://help.aliyun.com/zh/model-studio/developer-reference/billing-for-text-rerank
# 汇率按 1 USD ≈ 7.2 CNY 换算
model_list:

  # ==================================================
  # auto — 智能路由虚拟模型
  # task_router 回调在 pre_call_hook 中拦截 model="auto"
  # 根据任务类型自动重路由到最合适的模型组
  # 此条目仅用于让 "auto" 出现在 /v1/models 列表中
  # 实际请求会被 callback 改写为具体模型名
  # ==================================================
  - model_name: auto
    litellm_params:
      model: openai/qwen-plus
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY

  # ==================================================
  # 阿里云百炼（DashScope）— 主要供应商
  # 通过 OpenAI 兼容接口接入
  # ==================================================

  # === qwen-plus（通用性价比，日常任务主力） ===
  # 定价：输入 0.8元/M ≈ $0.00000111/token，输出 2元/M ≈ $0.00000278/token
  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 600
      tpm: 120000
      input_cost_per_token: 0.00000111
      output_cost_per_token: 0.00000278

  # === qwen3.6-flash（极速轻量，简单任务降本） ===
  # 定价：输入 1.2元/M ≈ $0.00000167/token，输出 7.2元/M ≈ $0.00001/token
  - model_name: qwen3.6-flash
    litellm_params:
      model: openai/qwen3.6-flash
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 1000
      tpm: 200000
      input_cost_per_token: 0.00000167
      output_cost_per_token: 0.00001

  # === qwen3.6-plus（高质量，复杂任务） ===
  # 定价：输入 2元/M ≈ $0.00000278/token，输出 12元/M ≈ $0.00001667/token
  - model_name: qwen3.6-plus
    litellm_params:
      model: openai/qwen3.6-plus
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 300
      tpm: 80000
      input_cost_per_token: 0.00000278
      output_cost_per_token: 0.00001667

  # === qwen3-max（旗舰，最高质量推理） ===
  # 定价：输入 2.5元/M ≈ $0.00000347/token，输出 10元/M ≈ $0.00001389/token
  - model_name: qwen3-max
    litellm_params:
      model: openai/qwen3-max
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 100
      tpm: 30000
      input_cost_per_token: 0.00000347
      output_cost_per_token: 0.00001389

  # === deepseek-v3（DeepSeek 推理，百炼托管） ===
  # 定价：输入 1元/M ≈ $0.00000139/token，输出 8元/M ≈ $0.00001111/token
  - model_name: deepseek-v3
    litellm_params:
      model: openai/deepseek-v3
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 300
      tpm: 60000
      input_cost_per_token: 0.00000139
      output_cost_per_token: 0.00001111

  # === 百炼 Embedding 模型（供语义缓存使用） ===
  - model_name: bailian-embedding
    litellm_params:
      model: openai/text-embedding-v3
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY

  # ==================================================
  # Ollama 本地模型 — 零成本层
  # 运行在宿主机 localhost:11434，Docker 容器通过 host.docker.internal 访问
  # 用途：接管简单任务（零 API 费用）、作为云端模型全部失败时的最终兜底
  # ==================================================

  # === qwen2.5-local（本地 7.6B，零成本） ===
  # 本地推理，无 API 费用，适合简单问答和兜底场景
  - model_name: qwen2.5-local
    litellm_params:
      model: ollama/qwen2.5:latest
      api_base: os.environ/OLLAMA_API_BASE
      rpm: 60
      tpm: 50000
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ==================================================
  # OpenAI / Anthropic（备用供应商，跨云冗余）
  # ==================================================

  # === GPT-4o（备用通道：OpenAI 直连） ===
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      tpm: 30000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  # === GPT-4o（备用通道：OpenRouter） ===
  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OR_API_KEY
      rpm: 200
      tpm: 20000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  # === Claude 3.5 Sonnet（Anthropic，qwen3-max 的 fallback） ===
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 50
      tpm: 40000
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

# ---- 全局设置 ----
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  database_url: os.environ/DATABASE_URL
  redis_url: os.environ/REDIS_URL           # 限流状态 + 路由状态

# ---- LiteLLM 设置 ----
litellm_settings:
  drop_params: true
  telemetry: false

  # === 语义缓存（Qdrant Semantic Cache） ===
  # 基于向量相似度匹配相似请求，命中时跳过 API 调用
  # 相比精确匹配缓存，可额外命中 30-80% 的语义相似查询
  # 依赖：DASHSCOPE_API_KEY（用于 bailian-embedding 模型）+ Qdrant 服务
  # 当 DASHSCOPE_API_KEY 为空时，embedding 调用会 401 失败并阻断主请求
  # CLI init 命令会根据 API Key 状态自动决定是否启用缓存
  cache: true
  cache_params:
    type: qdrant-semantic
    qdrant_semantic_cache_embedding_model: bailian-embedding  # 使用百炼 Embedding 模型
    qdrant_collection_name: litellm_cache
    qdrant_quantization_config: binary
    qdrant_semantic_cache_vector_size: 1024                    # DashScope text-embedding-v3 默认维度
    similarity_threshold: 0.95                                 # 相似度 ≥ 0.95 视为命中（0.8 会导致误命中）
    ttl: 86400                                                 # 缓存 TTL 24 小时（秒），自动清理过期条目

  # === 回调链（Phase 2 激活） ===
  # prometheus:       内置指标采集（/metrics 端点）
  # task_router:      智能任务路由（model="auto" 时自动分类并选模型）
  # quota_tracker:    按 Key + User 维度追踪花费到 Prometheus
  callbacks: ["prometheus", "custom_callbacks.task_router", "custom_callbacks.quota_tracker"]

  # === 预算管理默认值 ===
  # 新创建的虚拟密钥默认预算上限 $10/月（可通过 /key/generate 覆盖）
  default_key_generate_params:
    max_budget: 10
    budget_duration: "30d"

  # === 预算安全上限 ===
  # 防止误操作创建超高预算密钥
  upperbound_key_generate_params:
    max_budget: 1000
    budget_duration: "365d"

  # 重试 & 超时
  num_retries: 3
  request_timeout: 120  # 推理模型（qwen3.6-flash/plus）生成 reasoning tokens 需要更长时间

# ---- 路由策略 ----
# LiteLLM 原生路由：usage-based-routing-v2（基于 RPM/TPM 用量感知分配）
#
# [Phase 2 已实现] 智能分配层：
#   在原生路由之上增加一层自定义回调（task_router），根据任务复杂度自动选择模型组：
#     - 简单 Q&A / 信息查询 → qwen2.5-local（Ollama 本地，零 API 费用）
#     - 日常对话 / 文档摘要 → qwen-plus（百炼通用性价比）
#     - 代码生成 / 数学逻辑 → deepseek-v3（DeepSeek 专项能力）
#     - 复杂推理 / 深度分析 → qwen3.6-plus（百炼高质量综合推理）
#   触发方式：请求中 model="auto"
#   分类方法：正则规则优先 → LLM 兜底（qwen3.6-flash 或 Ollama qwen2.5:latest）
#
# [分类器自动选择]
#   DASHSCOPE_API_KEY 已设置 → qwen3.6-flash（云端，极速低成本）
#   DASHSCOPE_API_KEY 为空   → qwen2.5:latest（Ollama 本地，零成本兜底）
#
#   [三层 fallback 架构]
#   云端高质量 → 云端降级 → 本地兜底（qwen2.5-local，零成本、零依赖）
#
#   [流式响应自动启用]
#   推理模型（qwen3.6-flash/plus、qwen3-max、deepseek-v3）生成 reasoning tokens 耗时较长，
#   task_router 回调会自动为这些模型启用 stream=true，避免 HTTP 超时。
#   非推理模型（qwen-plus、qwen2.5-local）不受影响，仍返回标准 JSON 响应。
router_settings:
  routing_strategy: usage-based-routing-v2
  # fallbacks 使用 config_worker.yaml model_list 中已注册的模型
  # 当 .env 中 DASHSCOPE_API_KEY 为空时，仅 DB 模型 + Ollama 本地模型可调用
  # qwen2.5-local 作为最终兜底：即使所有云端 API 全部失败，本地模型仍可用
  fallbacks:
    - { "qwen3.6-plus": ["qwen-plus"] }           # plus 失败 → qwen-plus（降级）
    - { "qwen3-max": ["qwen3.6-plus"] }            # max 失败 → plus
    - { "deepseek-v3": ["qwen3.6-plus"] }          # deepseek 失败 → plus
    - { "qwen-plus": ["qwen3.6-flash"] }           # plus 失败 → flash
    - { "qwen3.6-flash": ["qwen2.5-local"] }       # flash 失败 → 本地模型（零成本兜底）
