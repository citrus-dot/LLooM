# ====================================
# Redis 7 配置 — LiteLLM 路由状态 + 限流
# ====================================
# 职责：存储 LiteLLM 的路由状态、限流计数器、虚拟 Key 缓存
# 非缓存用途（语义缓存由 Qdrant 负责）
# 优化依据：Redis 最佳实践（安全、持久化、内存、性能）
# ====================================

# ---- 网络与安全 ----
# 绑定所有接口（Docker 容器间通信需要）
bind 0.0.0.0
# 保护模式：未设置密码时拒绝远程访问（已设密码，可安全开启）
protected-mode yes
# 密码认证（LiteLLM 通过 redis://:password@host:port 连接）
requirepass litellm_redis_2026

# ---- 危险命令重命名（禁用） ----
# 防止误操作清空数据或查看敏感配置
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# ---- 持久化 ----
# AOF 追加持久化：每秒刷盘，保证路由状态和限流数据不丢失
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
# AOF 重写触发条件：文件大小比上次重写后增长 100%
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb

# RDB 快照作为备份（多层触发，兼顾性能与数据安全）
save 900 1
save 300 5
save 60 100
# RDB 文件压缩（CPU 换空间，路由数据量小，开启无妨）
rdbcompression yes
# RDB 校验和（防止文件损坏）
rdbchecksum yes

# ---- 内存管理 ----
# 最大内存 256MB（路由状态和限流数据体积小，256MB 足够）
maxmemory 256mb
# LRU 淘汰策略：当内存满时淘汰最近最少使用的 Key
# 适用于缓存场景，路由状态会被 LiteLLM 定期刷新
maxmemory-policy allkeys-lru
# 采样精度：5 是默认值，值越大淘汰越精确但 CPU 消耗越高
maxmemory-samples 5

# ---- Lazyfree（非阻塞内存回收） ----
# 淘汰 Key 时异步释放内存，避免主线程阻塞
lazyfree-lazy-eviction yes
# 过期 Key 异步删除
lazyfree-lazy-expire yes
# DEL 命令异步删除大 Key
lazyfree-lazy-server-del yes
# AOF 重写和 RDB 保存时异步删除
lazyfree-lazy-user-del yes

# ---- 连接管理 ----
# TCP 保活间隔 60 秒，防止 Docker 网络中断连接
tcp-keepalive 60
# TCP backlog 队列长度（高并发场景防止连接被拒绝）
tcp-backlog 511
# 客户端空闲 300 秒后断开
timeout 300
# 最大客户端连接数
maxclients 200

# ---- 数据库 ----
# 使用多个逻辑 DB 隔离不同用途
# DB 0: LiteLLM 路由状态 + 限流计数器（默认）
# DB 1: 预留（未来可用作应用级缓存）
databases 16

# ---- 日志 ----
# 生产环境使用 notice 级别
loglevel notice
# 慢查询：超过 10ms 的命令记录到慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128
# 客户端列表缓冲区（监控连接状态）
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ---- 性能调优 ----
# 后台任务执行频率（Hz），10 是默认值
# 值越高过期 Key 清理越及时，但 CPU 消耗越大
hz 10
# 动态 Hz：根据客户端数量自动调整
dynamic-hz yes
