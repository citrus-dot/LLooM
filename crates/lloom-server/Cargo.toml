[package]
name = "lloom-server"
version = "2.1.0"
edition = "2021"
description = "LLooM headless server — REST + WebUI on :7861"

[[bin]]
name = "lloom-server"
path = "src/main.rs"

[dependencies]
lloom-core = { path = "../../crates/lloom-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "query", "macros"] }
