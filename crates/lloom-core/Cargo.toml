[package]
name = "lloom-core"
version = "2.1.0"
edition = "2021"
description = "LLooM business core — Rust server, routing, security, process management (UI-agnostic)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
fancy-regex = "0.19"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "query", "macros"] }
reqwest = { version = "0.13", features = ["json"] }
