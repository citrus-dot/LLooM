[package]
name = "lloom-tui"
version = "2.1.0"
edition = "2021"
description = "LLooM TUI — terminal user interface for the LLooM routing platform"

[[bin]]
name = "lloom-tui"
path = "src/main.rs"

[dependencies]
lloom-core = { path = "../../crates/lloom-core" }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
