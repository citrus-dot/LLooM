[package]
name = "lloom-cli"
version = "2.1.0"
edition = "2021"
description = "LLooM CLI — command-line interface for the LLooM routing platform"

[[bin]]
name = "lloom-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
