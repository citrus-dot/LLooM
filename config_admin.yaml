# ====================================
# 控制面 Admin Instance 配置
# 职责：用户管理 / Key 生成 / 配置变更 / Dashboard
# 端口：4000（主机）→ 4000（容器）
# ====================================

# ---- 模型列表（Admin 仅需 Embedding 模型供缓存使用） ----
model_list:
  - model_name: bailian-embedding
    litellm_params:
      model: openai/text-embedding-v3
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY

# ---- 全局设置 ----
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true                # 模型配置存 DB，Admin/Worker 共享
  store_prompts_in_spend_logs: true
  database_url: os.environ/DATABASE_URL
  redis_url: os.environ/REDIS_URL        # 限流状态 + 路由状态

# ---- LiteLLM 设置 ----
litellm_settings:
  drop_params: true
  telemetry: false

  # === 语义缓存（与 Worker 保持一致） ===
  cache: true
  cache_params:
    type: qdrant-semantic
    qdrant_semantic_cache_embedding_model: bailian-embedding
    qdrant_collection_name: litellm_cache
    qdrant_quantization_config: binary
    qdrant_semantic_cache_vector_size: 1024
    similarity_threshold: 0.8

  # Prometheus 指标回调
  callbacks: ["prometheus"]

# ---- 路由策略 ----
router_settings:
  routing_strategy: usage-based-routing-v2
