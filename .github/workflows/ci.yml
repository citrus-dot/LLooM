# 质量 CI：锁住「构建 + 测试全绿再提交」约定
#
# 与 release.yml 的关系：release 只管三平台打包发版；本文件是质量门。
# 触发：push v2 / PR / 手动；纯 md 变更不触发。
# 注：网络不受限的 runner 上直接用官方源，本地受限网络镜像约定不适用于 CI。

name: ci

on:
  push:
    branches: [v2]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  # Linux runner 用 24.04：ort 2.0.0-rc.13（fastembed 传递依赖）的预编译 ORT
  # 静态库按 glibc≥2.38 / GCC 13 工具链构建，22.04 链接报
  # __isoc23_strtoll / std::_M_replace_cold 未定义（pykeio/ort#523）。
  rust:
    name: Rust clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy（0 告警门）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  webui:
    name: WebUI typecheck + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      # build = tsc -b && vite build，类型检查一并覆盖
      - run: npm run build
