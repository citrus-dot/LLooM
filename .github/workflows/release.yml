# 三平台安装包构建 + Release 发布
#
# 触发：
#   push tag v*        → 构建 + 发布 GitHub Release（附三平台安装包）
#   push v2 分支        → 构建三平台安装包（仅产 artifacts 供检查，不发 Release）
#   workflow_dispatch  → 手动构建（同上）
#
# 产物（Rust release 二进制 + 静态 WebUI）：
#   dist/LLooM-<ver>-linux-<arch>.tar.gz
#   dist/LLooM-<ver>-macos-<arch>.tar.gz
#   dist/LLooM-<ver>-windows-<arch>.zip
#
# 说明：
#   - Linux 用 ubuntu-24.04：ort 预编译静态库按 glibc≥2.38 / GCC 13 工具链构建（pykeio/ort#523），
#     22.04 链接报 __isoc23_strtoll 未定义；产物 glibc 底线实际由该静态库决定，不因 runner 而变。
#   - Intel Mac（darwin-x86_64）：pyke 不分发该 target 的 ORT 预编译库，lloom-core 的 Cargo.toml
#     仅此 target 切 fastembed/ort-load-dynamic——运行期 dlopen libonnxruntime.dylib（brew install
#     onnxruntime；缺失时 L2 语义缓存自动降级，L1/路由不受影响）。故 macos-13 构建前装 brew 包，
#     既供 CI 冒烟也锁定产物可加载版本。arm64 runner 亦可 --target x86_64-apple-darwin 交叉产出。
#   - Ollama 不捆绑；macOS 产物未签名（用户首次运行需 xattr -cr 绕 Gatekeeper）。

name: release

on:
  push:
    branches: [v2]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (macos-14+ 均为 M 系)
            arch: arm64
          - os: macos-latest        # 同一 runner 交叉产出 Intel 包（见下「Intel 交叉编译」）
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
          - os: windows-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # git describe 需要 tag 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Intel 交叉编译：pyke 无 x86_64-apple-darwin 的 ORT 预编译静态库，
      # 但该 target 走 ort-load-dynamic（编译期不链 ORT、运行期 dlopen），
      # 故 arm64 runner 可正常交叉出 Intel 包——绕开 macos-13 的排队困境
      # （GitHub 淘汰 Intel 硬件后该镜像排队常达数小时）。
      - name: Add Rust Intel target (x86_64 macOS builds)
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Build WebUI
        shell: bash
        run: |
          cd webui
          npm ci
          npm run build

      - name: Build Rust (release)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            cargo build --workspace --release --target x86_64-apple-darwin
          else
            cargo build --workspace --release
          fi

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            bash scripts/package.sh --target x86_64-apple-darwin
          else
            bash scripts/package.sh
          fi

      # Windows 用 runner 默认 pwsh：cmd /c + 反斜杠路径原生可用。经 Git Bash
      # 转发 cmd /c 会静默退出（横幅后无输出，exit 0），两次踩坑实录见 git log。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cmd /c scripts\package.bat

      - name: Smoke Intel build (load-dynamic wiring present)
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          # load-dynamic：编译期不链 .dylib，二进制应含 dlopen 目标名与中文提示；
          # 真正 dlopen 发生在用户机首次语义缓存调用，此处只验链接形态。
          BIN="target/x86_64-apple-darwin/release/lloom-server"
          [ -x "$BIN" ] || { echo "missing $BIN"; exit 1; }
          file "$BIN" | grep -q x86_64 || { echo "not an Intel binary"; exit 1; }
          # 避免 strings | grep -q：grep 提前退出会令 strings flush 管道失败
          # （macOS 报 failed to flush output 非零退出）。先落盘再查。
          strings "$BIN" > /tmp/lloom-strings.txt || { echo "strings failed"; exit 1; }
          grep -q libonnxruntime /tmp/lloom-strings.txt \
            && echo "smoke ok: load-dynamic target embedded"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
