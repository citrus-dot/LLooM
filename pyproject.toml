[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lloom"
version = "2.1.0"
description = "LLooM - Intelligent LLM Routing Platform (Rust core + Python AI micro-service)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.82.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# 打包 AI 微服务所需（CI / build.sh: uv sync --frozen --extra build）
build = [
    "pyinstaller>=6.0",
]
# 开发/测试（chromadb 为可选语义缓存，缺失时 ai_service 优雅降级）
dev = [
    "pytest>=8.0",
    "chromadb>=0.5.0",
]

[project.scripts]
# The AI micro-service entry point (used by PyInstaller spec).
ai-service = "api.ai_service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.ruff]
# 代码库大量 CJK 注释与长 SSE payload 行，88 放不下；120 覆盖现状（仅个别行手动折行）。
line-length = 120

# uv 使用说明：
#   本地开发：uv sync --extra dev --extra build（依赖按 uv.lock 冻结）
#   镜像：uv 不读 pip.conf，受限网络下本地导出镜像：
#     export UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
#   CI 用官方 PyPI，镜像不进仓库。
